name: ci
on: [push, pull_request]

jobs:
  backend:
    name: Audit log & Merkle batching tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt pytest
      # These tests are isolated and need no blockchain node. The one test that
      # deploys a contract is skipped here; run the full suite locally against Hardhat.
      - run: >
          pytest -q backend/core/blockchain/tests/test_audit_log.py
          backend/core/blockchain/tests/test_batching.py
          -k "not chain_anchor"

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          VITE_API_BASE_URL: http://127.0.0.1:8001
